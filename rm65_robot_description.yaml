# Minimal Lula robot description for RM65-B traditional FK/IK.
# Collision spheres are intentionally omitted because Lula IK does not perform
# collision avoidance. They will be added later for RMPflow/path planning.

api_version: 1.0

cspace:
  - joint_1
  - joint_2
  - joint_3
  - joint_4
  - joint_5
  - joint_6

root_link: base_link

default_q: [0.0, -0.5, 1.0, 0.0, 0.5, 0.0]

acceleration_limits: [4.0, 4.0, 4.0, 6.0, 6.0, 8.0]
jerk_limits: [500.0, 500.0, 500.0, 800.0, 800.0, 1000.0]

cspace_to_urdf_rules: []
collision_spheres: []
